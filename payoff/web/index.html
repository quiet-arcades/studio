<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1e5eff">
  <title>Payoff — Bite-Size Game Theory</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top-bar">
    <div class="container top-inner">
      <div>
        <p class="eyebrow">Prignano Games</p>
        <h1>Payoff</h1>
      </div>
      <div class="controls">
        <label class="toggle">
          <input id="eli5-toggle" type="checkbox">
          <span>Plain Language</span>
        </label>
        <span id="progress-pill" class="pill">0 / 6 done</span>
      </div>
    </div>
  </header>

  <main class="container layout">
    <nav aria-label="Lessons" class="lesson-nav">
      <h2>Lessons</h2>
      <ol id="lesson-list" class="lesson-list"></ol>
    </nav>

    <section class="stage" aria-live="polite">
      <div class="stage-head">
        <div>
          <p id="lesson-subtitle" class="subtitle"></p>
          <h2 id="lesson-title"></h2>
        </div>
        <div id="bot-picker" class="bot-picker"></div>
      </div>

      <p id="bot-hint" class="bot-hint"></p>

      <div class="scoreboard">
        <div class="score-box">
          <span class="score-label">You</span>
          <strong id="player-score">0</strong>
        </div>
        <div class="score-box">
          <span id="round-counter" class="score-label">Round 1 / 1</span>
          <strong id="match-status">Pick a move</strong>
        </div>
        <div class="score-box">
          <span id="bot-score-label" class="score-label">Bot</span>
          <strong id="bot-score">0</strong>
        </div>
      </div>

      <div id="action-buttons" class="actions"></div>

      <div id="matrix-wrap" class="matrix-wrap"></div>

      <div id="takeaway-card" class="takeaway hidden">
        <h3>Why did that happen?</h3>
        <p id="takeaway-text"></p>
        <button id="replay-btn" type="button" class="btn btn-primary">Play Again</button>
      </div>

      <div class="history-wrap">
        <h3>Rounds</h3>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
