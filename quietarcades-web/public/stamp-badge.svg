<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44" fill="none" role="img" aria-labelledby="qa-stamp-title">
  <title id="qa-stamp-title">Quiet Arcades — Zero Ads, Zero Tracking</title>
  <!-- Tactile Colophon Cartouche -->
  <rect x="0.75" y="0.75" width="218.5" height="42.5" rx="7.25" stroke="currentColor" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- Hanko Vermilion Seal Block -->
  <rect x="8" y="8" width="28" height="28" rx="5" fill="var(--qa-vermilion, #d9381e)"/>
  <!-- Carved 2x2 Matrix Inside Hanko Seal -->
  <g>
    <rect x="12" y="12" width="8.5" height="8.5" rx="1.5" fill="var(--qa-on-vermilion, #ffffff)"/>
    <rect x="24.25" y="12.75" width="7" height="7" rx="1" stroke="var(--qa-on-vermilion, #ffffff)" stroke-width="1.5"/>
    <rect x="12.75" y="24.25" width="7" height="7" rx="1" stroke="var(--qa-on-vermilion, #ffffff)" stroke-width="1.5"/>
    <circle cx="27.75" cy="27.75" r="4.4" fill="var(--qa-on-vermilion, #ffffff)"/>
  </g>
  <!-- Colophon Typography -->
  <text
    x="46"
    y="21"
    fill="currentColor"
    font-family="'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="13.5"
    font-weight="700"
    letter-spacing="-0.02em">Quiet Arcades</text>
  <text
    x="46"
    y="33.5"
    fill="currentColor"
    fill-opacity="0.68"
    font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', 'Cascadia Code', 'IBM Plex Mono', 'DejaVu Sans Mono', monospace"
    font-size="8.5"
    font-weight="500"
    letter-spacing="0.07em">NO ADS · NO TRACKING</text>
</svg>
