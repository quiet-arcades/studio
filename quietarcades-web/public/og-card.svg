<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-labelledby="qa-og-title">
  <title id="qa-og-title">Quiet Arcades — Calm, clever games that respect your time.</title>

  <!-- Warm Washi Paper Canvas -->
  <rect width="1200" height="630" fill="#f7f5f0"/>

  <!-- Subtle Right-Side Strategy Lattice (Go / Chess Intersection Grid) -->
  <g stroke="#e6e2d8" stroke-width="1">
    <line x1="720" y1="36" x2="720" y2="594"/>
    <line x1="808" y1="36" x2="808" y2="594"/>
    <line x1="896" y1="36" x2="896" y2="594"/>
    <line x1="984" y1="36" x2="984" y2="594"/>
    <line x1="1072" y1="36" x2="1072" y2="594"/>
    <line x1="660" y1="139" x2="1164" y2="139"/>
    <line x1="660" y1="227" x2="1164" y2="227"/>
    <line x1="660" y1="315" x2="1164" y2="315"/>
    <line x1="660" y1="403" x2="1164" y2="403"/>
    <line x1="660" y1="491" x2="1164" y2="491"/>
  </g>

  <!-- Star Points (Hoshi) on Grid -->
  <g fill="#c9c4b8">
    <circle cx="720" cy="139" r="3"/>
    <circle cx="1072" cy="139" r="3"/>
    <circle cx="720" cy="491" r="3"/>
    <circle cx="1072" cy="491" r="3"/>
  </g>

  <!-- Architectural Outer Print Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="16" stroke="#dcd8ce" stroke-width="1.5"/>

  <!-- Left Column: Studio Masthead & Narrative -->
  <!-- Eyebrow Pill -->
  <g transform="translate(88, 92)">
    <rect x="0" y="0" width="232" height="32" rx="16" fill="#edeae2" stroke="#dcd8ce" stroke-width="1"/>
    <circle cx="18" cy="16" r="4.5" fill="#d9381e"/>
    <text
      x="32"
      y="20.5"
      fill="#4a4946"
      font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', 'DejaVu Sans Mono', monospace"
      font-size="11.5"
      font-weight="600"
      letter-spacing="0.09em">INDIE GAME STUDIO</text>
  </g>

  <!-- Primary Wordmark -->
  <text
    x="84"
    y="244"
    fill="#161618"
    font-family="'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="76"
    font-weight="700"
    letter-spacing="-0.03em">Quiet Arcades</text>

  <!-- Hanko Vermilion Rule -->
  <rect x="88" y="276" width="64" height="4" rx="2" fill="#d9381e"/>

  <!-- Tagline in Editorial Serif -->
  <text
    x="88"
    y="334"
    fill="#161618"
    font-family="'Newsreader', 'Charter', 'Bitstream Charter', 'Iowan Old Style', Georgia, serif"
    font-size="29"
    font-style="italic">“Calm, clever games that respect your time.”</text>

  <!-- Studio Promise Subcopy -->
  <text
    x="88"
    y="386"
    fill="#4a4946"
    font-family="'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18.5"
    font-weight="400">Original, craft-first browser &amp; installable strategy and arcade games.</text>
  <text
    x="88"
    y="414"
    fill="#4a4946"
    font-family="'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18.5"
    font-weight="400">Zero ads. Zero tracking. No dark patterns. Kid-safe.</text>

  <!-- Discipline Tags Footer -->
  <g transform="translate(88, 504)" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.06em">
    <rect x="0" y="0" width="60" height="32" rx="6" fill="#ffffff" stroke="#dcd8ce" stroke-width="1.25"/>
    <text x="30" y="20.5" text-anchor="middle" fill="#161618">GO</text>

    <rect x="72" y="0" width="88" height="32" rx="6" fill="#ffffff" stroke="#dcd8ce" stroke-width="1.25"/>
    <text x="116" y="20.5" text-anchor="middle" fill="#161618">CHESS</text>

    <rect x="172" y="0" width="146" height="32" rx="6" fill="#ffffff" stroke="#dcd8ce" stroke-width="1.25"/>
    <text x="245" y="20.5" text-anchor="middle" fill="#161618">GAME THEORY</text>

    <rect x="330" y="0" width="96" height="32" rx="6" fill="#ffffff" stroke="#dcd8ce" stroke-width="1.25"/>
    <text x="378" y="20.5" text-anchor="middle" fill="#161618">ARCADE</text>
  </g>

  <!-- Right Column: Sculptural Tactile 2x2 Cornerstone Emblem Card -->
  <g transform="translate(744, 139)">
    <!-- Tactile Paper Card Base with Crisp Offset Shadow -->
    <rect x="6" y="8" width="352" height="352" rx="28" fill="#e5e0d5"/>
    <rect x="0" y="0" width="352" height="352" rx="28" fill="#ffffff" stroke="#dcd8ce" stroke-width="2"/>

    <!-- Scaled 2x2 Cornerstone Matrix (240x240 active inside 352x352 -> 56px margin) -->
    <g transform="translate(56, 56)">
      <!-- Top-Left: Solid Sumi Ink Tile -->
      <rect x="0" y="0" width="104" height="104" rx="20" fill="#161618"/>
      <!-- Top-Right: Stroked Territory Cell -->
      <rect x="144" y="8" width="88" height="88" rx="12" fill="#f7f5f0" stroke="#161618" stroke-width="16"/>
      <!-- Bottom-Left: Stroked Territory Cell -->
      <rect x="8" y="144" width="88" height="88" rx="12" fill="#f7f5f0" stroke="#161618" stroke-width="16"/>
      <!-- Bottom-Right: Hanko Vermilion Stone -->
      <circle cx="188" cy="188" r="54" fill="#d9381e"/>
    </g>

    <!-- Subtle Coordinate Micro-Labels on Card Perimeter -->
    <text x="28" y="34" fill="#8d8a82" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="0.06em">A1 · B2</text>
    <text x="324" y="332" text-anchor="end" fill="#d9381e" font-family="'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.08em">SEAL · 01</text>
  </g>
</svg>
