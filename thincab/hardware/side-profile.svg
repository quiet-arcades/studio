<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="480" height="560" fill="#f7f5f0"/>
  <text x="30" y="28" font-size="14" font-weight="bold" fill="#111214">ThinCab Side Profile (Scale: 20px = 1")</text>

  <!-- Coordinate origin (0",0") at (60, 500) -->
  <!-- Side Panel Polygon -->
  <polygon points="60,500 390,500 390,380 250,370 170,70 60,70"
           fill="#e8e2d5" stroke="#111214" stroke-width="2.5"/>

  <!-- Internal Layout Reference (dashed) -->
  <!-- Bottom Base (10.0" from rear) -->
  <rect x="60" y="490" width="200" height="10" fill="#d9381e" fill-opacity="0.25" stroke="#d9381e" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="160" y="482" font-size="10" text-anchor="middle" fill="#d9381e">Bottom Base (10.0")</text>

  <!-- Under-deck Keyboard Dock Space -->
  <rect x="265" y="430" width="120" height="22" fill="none" stroke="#111214" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="325" y="445" font-size="9" text-anchor="middle" fill="#444">K400+ Dock</text>

  <!-- Screen Line (~15 deg back) -->
  <line x1="250" y1="365" x2="174" y2="85" stroke="#0066cc" stroke-width="3"/>
  <text x="232" y="220" font-size="11" font-weight="bold" fill="#0066cc" transform="rotate(-75 232 220)">24" IPS (~15° tilt)</text>

  <!-- Vertex Coordinates -->
  <circle cx="60" cy="500" r="3.5" fill="#d9381e"/>
  <text x="64" y="518" font-size="10" fill="#111214">(0", 0")</text>

  <circle cx="390" cy="500" r="3.5" fill="#d9381e"/>
  <text x="360" y="518" font-size="10" fill="#111214">(16.5", 0")</text>

  <circle cx="390" cy="380" r="3.5" fill="#d9381e"/>
  <text x="396" y="384" font-size="10" fill="#111214">(16.5", 6.0")</text>

  <circle cx="250" cy="370" r="3.5" fill="#d9381e"/>
  <text x="258" y="366" font-size="10" fill="#111214">(9.5", 6.5")</text>

  <circle cx="170" cy="70" r="3.5" fill="#d9381e"/>
  <text x="176" y="66" font-size="10" fill="#111214">(5.5", 21.5")</text>

  <circle cx="60" cy="70" r="3.5" fill="#d9381e"/>
  <text x="45" y="60" font-size="10" fill="#111214">(0", 21.5")</text>
</svg>
